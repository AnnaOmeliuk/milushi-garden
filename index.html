<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>MILUSHI GARDEN — Сезонне. Свіже. Своє. · Милуші, Волинь</title>
    <meta
      name="description"
      content="Сімейне господарство Milushi Garden у Милушах на Волині. Яблука, овочі, ягоди та заготівлі — замовлення через Telegram, Viber або телефон."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MILUSHI GARDEN — Сезонне. Свіже. Своє." />
    <meta
      property="og:description"
      content="Сімейне господарство в Милушах, Волинь. Сезонні фрукти, овочі та ягоди напряму від виробника."
    />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:image" content="/images/hero.svg" />
    <meta name="theme-color" content="#536B4F" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function () {
        var m = new URLSearchParams(location.search).get('season')
        var season =
          m === 'spring' || m === 'summer' || m === 'autumn' || m === 'winter'
            ? m
            : (function () {
                var month = new Date().getMonth() + 1
                if (month >= 3 && month <= 5) return 'spring'
                if (month >= 6 && month <= 8) return 'summer'
                if (month >= 9 && month <= 11) return 'autumn'
                return 'winter'
              })()
        document.documentElement.dataset.season = season
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
